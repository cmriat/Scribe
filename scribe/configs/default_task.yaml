# Default task annotation config for Scribe.
#
# Loader precedence (annotation_store.load_task_annotation_store):
#   1. <dataset_root>/annotations/task_annotation_config.yaml   (per-dataset override)
#   2. <dataset_root>/annotations/task_annotation_config.json   (runtime mutations from frontend)
#   3. this file (scribe/configs/default_task.yaml)             (builtin baseline)
#   4. DEFAULT_TASK_ANNOTATION_STORE in annotation_store.py     (last-resort dict)
#
# YAML field reference:
#   event_types[]              global frame-event whitelist (id, title, color)
#   tasks.<id>:
#     display_name             user-facing
#     match_keywords           auto-resolve task by language_instruction substring match
#     allow_custom_labels      reject non-listed stage_label when false
#     outcomes[]               valid `outcome` values for segments in this task
#     schemes.<scheme>:
#       display_name
#       stage_order_strict     primary=false (allow flatten_for_folding repeat),
#                              flatten_internal=false (weak order)
#       stage_order            ordered list of stage_label
#       stage_metadata.<id>    {title, color}
#       parent_scheme          (flatten_internal only) which scheme owns containment
#       parent_stage           (flatten_internal only) stage_label inside parent

version: 1
active_task_name: fold_error_event

event_types:
  - { id: Key grasp hesitation,    title: 关键抓取犹豫,      color: "#84cc16" }
  - { id: error fold detail,     title: 没叠好,      color: "#a855f7" } 
  - { id: missed_grasp,       title: 滑脱/未抓住,       color: "#f97316" }
  - { id: regrasp,            title: 重新抓取,         color: "#dc2626" }
  - { id: minor_adjust,       title: 折叠部分调整,      color: "#06b6d4" }


tasks:
  anystate_fold_bigshirt:
    display_name: 任意状态叠衣服
    match_keywords: [shirt]
    allow_custom_labels: false
    outcomes:
      - { id: Prolonged flattening time in any_states,    title: "任意展平完成时间过长" }
      - { id: Prolonged flattening time in flatten,    title: "折叠完成时间过长" }
      - { id: completed,             title: 完成 }
      - { id: not_completed_continue, title: "未完成，继续" }
      - { id: aborted_or_restart,    title: "中止/重启" }
    schemes:
      primary:
        display_name: 高层语义阶段
        stage_order_strict: false
        stage_order:
          - prepare_on_table
          - flatten_for_folding
          - fold_near_sleeve
          - place_folded_garment
        stage_metadata:
          prepare_on_table:     { title: 从左上角拿取衣服, color: "#0ea5e9" }
          flatten_for_folding:  { title: 任意状态-->展平,     color: "#10b981" }
          fold_near_sleeve:     { title: 展平--> 叠好,     color: "#3b82f6" }
          place_folded_garment: { title: 叠好 --> 移动到目标位置,     color: "#22c55e" }
      flatten_internal:
        display_name: 展平内部操作
        parent_scheme: primary
        parent_stage: flatten_for_folding
        stage_order_strict: false
        stage_order: [coarse_adjust, local_refine]
        stage_metadata:
          coarse_adjust: { title: 粗粒度调整, color: "#f59e0b" }
          local_refine:  { title: 局部微调,   color: "#ec4899" }
